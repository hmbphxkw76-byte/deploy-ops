name: cleanup

# deploy-ops 标准化清理流水线
# 阶段: 前置清理 → 仓库校验 → 收尾清理 + 工作区确认
# 触发: push(main) / pull_request / 手动 / 每周定时
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0' # 每周日 02:17 UTC

permissions:
  contents: read

concurrency:
  group: cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-pre:
    name: 阶段 1/3 · 前置清理
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 清理临时 / 构建 / 缓存残留
        run: bash scripts/cleanup.sh --pre

  validate:
    name: 阶段 2/3 · 仓库校验
    needs: cleanup-pre
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 语法 / 链接 / 一致性 / 密钥 / 残留校验
        run: bash scripts/validate.sh

  cleanup-post:
    name: 阶段 3/3 · 收尾清理与工作区确认
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 收尾清理 + 全局工具缓存清理
        run: bash scripts/cleanup.sh --post
      - name: 工作区必须干净（无残留、无未跟踪文件）
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '工作区存在残留：\n%s\n' "$status"
            exit 1
          fi
          echo "工作区干净：无残留垃圾数据 / 无冗余临时资源 / 无过期缓存文件"
